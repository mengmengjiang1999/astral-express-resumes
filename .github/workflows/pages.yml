name: Publish online editor

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'trailblazer/**'
      - 'trailblazer-light/**'
      - 'trailblazer-social-strip/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build editor and copy original templates
        run: npm run build
        env:
          BASE_PATH: /astral-express-resumes/
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Verify editing, exports and page layout
        run: npm test
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
